[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pr-attention"
version = "0.11.0"
description = "Deterministic exact-head PR attention snapshots for agentic software delivery."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alberto Racerro"}]

[project.scripts]
pr-attention = "pr_attention.cli:main"
pr-attention-bundle = "pr_attention.bundle_cli:main"
pr-attention-compact = "pr_attention.compact_cli:main"
pr-attention-rereview = "pr_attention.rereview_cli:main"
pr-attention-rereview-bundle = "pr_attention.rereview_bundle_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
