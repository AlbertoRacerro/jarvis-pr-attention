name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  live-snapshot-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: baseline
        name: Resolve exact merge-base baseline
        shell: bash
        run: echo "sha=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_OUTPUT"
      - id: attention
        uses: ./
        with:
          pr-number: ${{ github.event.pull_request.number }}
          accepted-head: ${{ steps.baseline.outputs.sha }}
          max-total-patch-bytes: "1000000"
          max-file-patch-bytes: "250000"
          reviewer-name: "ci-dogfood"
          reviewer-model: "deterministic-fixture"
      - id: synthetic
        name: Complete generated review-result template
        env:
          PACKET_FILE: ${{ steps.attention.outputs.review-packet-file }}
          TEMPLATE_FILE: ${{ steps.attention.outputs.review-result-template-file }}
          ENVELOPE_FILE: ${{ steps.attention.outputs.review-envelope-file }}
          PACKET_SHA256: ${{ steps.attention.outputs.packet-sha256 }}
        run: |
          out="${RUNNER_TEMP}/jarvis-pr-attention-synthetic-review-result.json"
          python3 - "$PACKET_FILE" "$TEMPLATE_FILE" "$ENVELOPE_FILE" "$PACKET_SHA256" "$out" <<'PY'
          import json, sys
          packet_path, template_path, envelope_path, digest, output = sys.argv[1:]
          with open(packet_path, encoding="utf-8") as handle:
              packet = json.load(handle)
          with open(template_path, encoding="utf-8") as handle:
              result = json.load(handle)
          with open(envelope_path, encoding="utf-8") as handle:
              envelope = json.load(handle)
          assert result["packet_sha256"] == digest
          assert result["head_sha"] == packet["head_sha"]
          assert result["verdict"] == "NEEDS_HUMAN"
          assert result["reviewed_files"] == []
          assert envelope["purpose"] == "SEMANTIC_REVIEW"
          assert envelope["content_trust"] == "UNTRUSTED_REPOSITORY_CONTENT"
          assert envelope["packet_sha256"] == digest
          assert envelope["review_result_template"] == result
          assert envelope["packet"] == packet
          assert any("not a digital signature" in notice for notice in envelope["security_notices"])
          assert any("untrusted data" in notice for notice in envelope["security_notices"])
          result["verdict"] = "PASS"
          result["reviewed_files"] = [item["path"] for item in packet["files"]]
          result["notes"] = ["Synthetic fixture used only to dogfood reviewer handoff and result validation."]
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(result, handle, sort_keys=True, indent=2)
              handle.write("\n")
          PY
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - id: validated
        uses: ./
        with:
          pr-number: ${{ github.event.pull_request.number }}
          accepted-head: ${{ steps.baseline.outputs.sha }}
          max-total-patch-bytes: "1000000"
          max-file-patch-bytes: "250000"
          reviewer-name: "ci-dogfood"
          reviewer-model: "deterministic-fixture"
          review-result-file: ${{ steps.synthetic.outputs.path }}
      - name: Verify exact head, handoff, and structured review-result binding
        env:
          SNAPSHOT_FILE: ${{ steps.validated.outputs.snapshot-file }}
          PACKET_FILE: ${{ steps.validated.outputs.review-packet-file }}
          TEMPLATE_FILE: ${{ steps.validated.outputs.review-result-template-file }}
          ENVELOPE_FILE: ${{ steps.validated.outputs.review-envelope-file }}
          VALIDATION_FILE: ${{ steps.validated.outputs.review-result-validation-file }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASELINE: ${{ steps.baseline.outputs.sha }}
          REVIEW_SCOPE: ${{ steps.validated.outputs.review-scope }}
          NEXT_ACTION: ${{ steps.validated.outputs.next-action-class }}
          PACKET_COVERAGE: ${{ steps.validated.outputs.packet-coverage }}
          PACKET_COMPLETE: ${{ steps.validated.outputs.packet-complete }}
          FIRST_PACKET_SHA256: ${{ steps.attention.outputs.packet-sha256 }}
          SECOND_PACKET_SHA256: ${{ steps.validated.outputs.packet-sha256 }}
          REVIEW_RESULT_STATUS: ${{ steps.validated.outputs.review-result-status }}
          REVIEW_RESULT_VALID: ${{ steps.validated.outputs.review-result-valid }}
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ["SNAPSHOT_FILE"], encoding="utf-8") as handle:
              snapshot = json.load(handle)
          with open(os.environ["PACKET_FILE"], encoding="utf-8") as handle:
              packet = json.load(handle)
          with open(os.environ["TEMPLATE_FILE"], encoding="utf-8") as handle:
              template = json.load(handle)
          with open(os.environ["ENVELOPE_FILE"], encoding="utf-8") as handle:
              envelope = json.load(handle)
          with open(os.environ["VALIDATION_FILE"], encoding="utf-8") as handle:
              validation = json.load(handle)
          assert snapshot["schema_version"] == 2
          assert snapshot["head_sha"] == os.environ["EXPECTED_HEAD"]
          assert snapshot["final_head_sha"] == os.environ["EXPECTED_HEAD"]
          assert snapshot["delta"]["accepted_head_sha"] == os.environ["EXPECTED_BASELINE"]
          assert snapshot["delta"]["relation"] == "AHEAD"
          assert snapshot["delta"]["review_scope"] == "DELTA"
          assert os.environ["REVIEW_SCOPE"] == "DELTA"
          assert os.environ["NEXT_ACTION"] in {"WAIT_FOR_GATES", "REVIEW_DELTA", "REPAIR", "INVESTIGATE_UNKNOWN"}
          assert snapshot["stale"] is False
          assert packet["accepted_head_sha"] == os.environ["EXPECTED_BASELINE"]
          assert packet["head_sha"] == os.environ["EXPECTED_HEAD"]
          assert packet["final_head_sha"] == os.environ["EXPECTED_HEAD"]
          assert packet["content_trust"] == "UNTRUSTED_REPOSITORY_CONTENT"
          assert packet["coverage"] == "COMPLETE"
          assert packet["complete"] is True
          assert packet["files"]
          assert os.environ["PACKET_COVERAGE"] == "COMPLETE"
          assert os.environ["PACKET_COMPLETE"] == "true"
          assert os.environ["FIRST_PACKET_SHA256"].startswith("sha256:")
          assert os.environ["FIRST_PACKET_SHA256"] == os.environ["SECOND_PACKET_SHA256"]
          assert template["packet_sha256"] == os.environ["SECOND_PACKET_SHA256"]
          assert template["verdict"] == "NEEDS_HUMAN"
          assert template["reviewed_files"] == []
          assert envelope["packet_sha256"] == os.environ["SECOND_PACKET_SHA256"]
          assert envelope["packet"] == packet
          assert envelope["review_result_template"] == template
          assert os.environ["REVIEW_RESULT_STATUS"] == "VALID_PASS"
          assert os.environ["REVIEW_RESULT_VALID"] == "true"
          assert validation["valid"] is True
          assert validation["status"] == "VALID_PASS"
          assert validation["head_sha"] == os.environ["EXPECTED_HEAD"]
          assert validation["live_head_sha"] == os.environ["EXPECTED_HEAD"]
          assert validation["packet_sha256"] == os.environ["SECOND_PACKET_SHA256"]
          PY
