name: Temporary mark PR14 ready
on:
  push:
    branches:
      - feature/v1.11-review-continuity
permissions:
  contents: read
  pull-requests: write
jobs:
  ready:
    if: github.repository == 'AlbertoRacerro/jarvis-pr-attention'
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 14 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 14 --repo AlbertoRacerro/jarvis-pr-attention
