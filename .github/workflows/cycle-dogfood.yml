name: Cycle dogfood

on:
  pull_request:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  cycle-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run compact V1.11 cycle action
        id: cycle
        uses: ./cycle
        with:
          pr-number: ${{ github.event.pull_request.number }}
          accepted-head: ${{ github.event.pull_request.base.sha }}
          reviewer-name: cycle-dogfood

      - name: Verify compact contract and artifacts
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          ACTUAL_HEAD: ${{ steps.cycle.outputs.head-sha }}
          REVIEW_MODE: ${{ steps.cycle.outputs.review-mode }}
          MERGE_CANDIDATE: ${{ steps.cycle.outputs.merge-candidate }}
          MANIFEST_FILE: ${{ steps.cycle.outputs.manifest-file }}
          ENVELOPE_FILE: ${{ steps.cycle.outputs.review-envelope-file }}
          TEMPLATE_FILE: ${{ steps.cycle.outputs.review-result-template-file }}
        run: |
          set -euo pipefail
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          test "$REVIEW_MODE" = "DELTA"
          test "$MERGE_CANDIDATE" = "false"
          test -s "$MANIFEST_FILE"
          test -s "$ENVELOPE_FILE"
          test -s "$TEMPLATE_FILE"
          python3 - "$MANIFEST_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["kind"] == "PR_ATTENTION_CYCLE"
          assert data["review_mode"] == "DELTA"
          assert data["head_sha"]
          assert data["artifacts"]["review_envelope_file"]
          assert data["artifacts"]["review_result_template_file"]
          PY
