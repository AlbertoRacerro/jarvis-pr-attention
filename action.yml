name: "Jarvis PR Attention"
description: "Generate exact-head PR evidence, reviewer handoff, semantic validation, integration gate, and one unified evidence bundle"
author: "Alberto Racerro"
inputs:
  pr-number:
    description: "Pull request number"
    required: true
  repository:
    description: "owner/repository; defaults to the current repository"
    required: false
    default: ${{ github.repository }}
  token:
    description: "GitHub token with read access to pull requests, checks, statuses and compare data"
    required: false
    default: ${{ github.token }}
  accepted-head:
    description: "Last semantically accepted full commit SHA; enables incremental review planning"
    required: false
    default: ""
  max-total-patch-bytes:
    description: "Maximum aggregate UTF-8 patch bytes in the review packet"
    required: false
    default: "120000"
  max-file-patch-bytes:
    description: "Maximum UTF-8 patch bytes included for any one file"
    required: false
    default: "30000"
  reviewer-name:
    description: "Reviewer identity prefilled into generated handoff artifacts"
    required: false
    default: "external-reviewer"
  reviewer-model:
    description: "Optional reviewer model/runtime label prefilled into handoff artifacts"
    required: false
    default: ""
  review-result-file:
    description: "Optional structured reviewer result JSON to validate against the generated packet and live head"
    required: false
    default: ""
outputs:
  attention:
    description: "READY, PENDING, BLOCKED, STALE or UNKNOWN"
    value: ${{ steps.snapshot.outputs.attention }}
  head-sha:
    description: "Exact head SHA the snapshot was collected for"
    value: ${{ steps.snapshot.outputs.head-sha }}
  next-action-class:
    description: "Deterministic next action class before semantic-review completion"
    value: ${{ steps.snapshot.outputs.next-action-class }}
  review-scope:
    description: "NONE, DELTA, FULL or UNKNOWN"
    value: ${{ steps.snapshot.outputs.review-scope }}
  delta-files:
    description: "Number of files in the accepted-head to current-head delta"
    value: ${{ steps.snapshot.outputs.delta-files }}
  snapshot-file:
    description: "Path to the JSON snapshot"
    value: ${{ steps.snapshot.outputs.snapshot-file }}
  review-packet-file:
    description: "Path to bounded JSON review packet; empty when accepted-head is not supplied"
    value: ${{ steps.snapshot.outputs.review-packet-file }}
  packet-coverage:
    description: "COMPLETE, PARTIAL, NONE or UNKNOWN"
    value: ${{ steps.snapshot.outputs.packet-coverage }}
  packet-complete:
    description: "true only when all required delta patch evidence fits and is available"
    value: ${{ steps.snapshot.outputs.packet-complete }}
  packet-patch-bytes:
    description: "UTF-8 patch bytes included in the review packet"
    value: ${{ steps.snapshot.outputs.packet-patch-bytes }}
  packet-sha256:
    description: "Stable SHA-256 content identity of the semantic review packet evidence; not a signature"
    value: ${{ steps.snapshot.outputs.packet-sha256 }}
  review-result-template-file:
    description: "Path to reviewer-result JSON template bound to the packet"
    value: ${{ steps.snapshot.outputs.review-result-template-file }}
  review-envelope-file:
    description: "Path to deterministic reviewer handoff envelope containing control plane plus untrusted evidence"
    value: ${{ steps.snapshot.outputs.review-envelope-file }}
  review-result-status:
    description: "NOT_RUN, VALID_PASS, VALID_FAIL, VALID_NEEDS_HUMAN, STALE or INVALID"
    value: ${{ steps.snapshot.outputs.review-result-status }}
  review-result-valid:
    description: "true only when the supplied structured review result is valid for this packet/live head"
    value: ${{ steps.snapshot.outputs.review-result-valid }}
  review-result-validation-file:
    description: "Path to JSON review result validation; empty when review-result-file is not supplied"
    value: ${{ steps.snapshot.outputs.review-result-validation-file }}
  integration-gate-status:
    description: "NOT_RUN, READY_TO_MERGE, WAIT_FOR_GATES, REPAIR, REVIEW_REQUIRED, NEEDS_HUMAN, VERIFY_LIVE, STALE or UNKNOWN"
    value: ${{ steps.snapshot.outputs.integration-gate-status }}
  integration-merge-ready:
    description: "true only for advisory READY_TO_MERGE; exact-head merge guard is still required"
    value: ${{ steps.snapshot.outputs.integration-merge-ready }}
  integration-gate-file:
    description: "Path to JSON integration gate; empty when review-result-file is not supplied"
    value: ${{ steps.snapshot.outputs.integration-gate-file }}
  evidence-bundle-file:
    description: "Path to the unified deterministic evidence bundle JSON"
    value: ${{ steps.snapshot.outputs.evidence-bundle-file }}
  evidence-bundle-sha256:
    description: "Stable content identity of the evidence bundle manifest; not a signature"
    value: ${{ steps.snapshot.outputs.evidence-bundle-sha256 }}
  evidence-bundle-phase:
    description: "SNAPSHOT_ONLY, PACKET_READY, REVIEW_HANDOFF_READY, REVIEW_VALIDATED or INTEGRATION_EVALUATED"
    value: ${{ steps.snapshot.outputs.evidence-bundle-phase }}
runs:
  using: "composite"
  steps:
    - id: snapshot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PYTHONPATH: ${{ github.action_path }}/src
        ACCEPTED_HEAD: ${{ inputs.accepted-head }}
        MAX_TOTAL_PATCH_BYTES: ${{ inputs.max-total-patch-bytes }}
        MAX_FILE_PATCH_BYTES: ${{ inputs.max-file-patch-bytes }}
        REVIEWER_NAME: ${{ inputs.reviewer-name }}
        REVIEWER_MODEL: ${{ inputs.reviewer-model }}
        REVIEW_RESULT_FILE: ${{ inputs.review-result-file }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}.json"
        args=(snapshot "${{ inputs.repository }}" "${{ inputs.pr-number }}" --json --output "$out" --no-state-exit)
        if [[ -n "$ACCEPTED_HEAD" ]]; then
          args+=(--accepted-head "$ACCEPTED_HEAD")
        fi
        python3 -m pr_attention "${args[@]}" >/dev/null
        snapshot_head=$(python3 - "$out" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            print(json.load(handle)["head_sha"])
        PY
        )

        packet_out=""
        packet_coverage="NONE"
        packet_complete="false"
        packet_patch_bytes="0"
        packet_digest=""
        template_out=""
        envelope_out=""
        if [[ -n "$ACCEPTED_HEAD" ]]; then
          packet_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-review-packet.json"
          python3 -m pr_attention review-packet "${{ inputs.repository }}" "${{ inputs.pr-number }}" \
            --accepted-head "$ACCEPTED_HEAD" \
            --expected-head "$snapshot_head" \
            --max-total-patch-bytes "$MAX_TOTAL_PATCH_BYTES" \
            --max-file-patch-bytes "$MAX_FILE_PATCH_BYTES" \
            --json --output "$packet_out" --no-coverage-exit >/dev/null
          readarray -t packet_values < <(python3 - "$packet_out" <<'PY'
        import json, sys
        from pr_attention.review_result import packet_sha256
        with open(sys.argv[1], encoding="utf-8") as handle:
            packet = json.load(handle)
        print(packet["coverage"])
        print(str(packet["complete"]).lower())
        print(packet["included_patch_bytes"])
        print(packet_sha256(packet))
        PY
          )
          packet_coverage="${packet_values[0]}"
          packet_complete="${packet_values[1]}"
          packet_patch_bytes="${packet_values[2]}"
          packet_digest="${packet_values[3]}"

          template_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-review-result-template.json"
          envelope_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-review-envelope.json"
          template_args=(review-result-template "$packet_out" --reviewer-name "$REVIEWER_NAME" --output "$template_out")
          envelope_args=(review-envelope "$packet_out" --reviewer-name "$REVIEWER_NAME" --output "$envelope_out")
          if [[ -n "$REVIEWER_MODEL" ]]; then
            template_args+=(--reviewer-model "$REVIEWER_MODEL")
            envelope_args+=(--reviewer-model "$REVIEWER_MODEL")
          fi
          python3 -m pr_attention "${template_args[@]}" >/dev/null
          python3 -m pr_attention "${envelope_args[@]}" >/dev/null
        fi

        validation_out=""
        review_result_status="NOT_RUN"
        review_result_valid="false"
        integration_gate_out=""
        integration_gate_status="NOT_RUN"
        integration_merge_ready="false"
        if [[ -n "$REVIEW_RESULT_FILE" ]]; then
          if [[ -z "$packet_out" ]]; then
            echo "review-result-file requires accepted-head so a review packet can be generated" >&2
            exit 2
          fi
          validation_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-review-result-validation.json"
          python3 -m pr_attention validate-review-result "$packet_out" "$REVIEW_RESULT_FILE" \
            --live --json --output "$validation_out" --no-validation-exit >/dev/null
          readarray -t validation_values < <(python3 - "$validation_out" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            validation = json.load(handle)
        print(validation["status"])
        print(str(validation["valid"]).lower())
        PY
          )
          review_result_status="${validation_values[0]}"
          review_result_valid="${validation_values[1]}"

          integration_gate_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-integration-gate.json"
          python3 -m pr_attention integration-gate "$out" "$validation_out" --output "$integration_gate_out" --no-gate-exit >/dev/null
          readarray -t integration_values < <(python3 - "$integration_gate_out" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            gate = json.load(handle)
        print(gate["status"])
        print(str(gate["merge_ready"]).lower())
        PY
          )
          integration_gate_status="${integration_values[0]}"
          integration_merge_ready="${integration_values[1]}"
        fi

        bundle_out="${RUNNER_TEMP}/jarvis-pr-attention-${{ inputs.pr-number }}-evidence-bundle.json"
        bundle_args=(build "$out" --output "$bundle_out")
        if [[ -n "$packet_out" ]]; then
          bundle_args+=(--packet-file "$packet_out" --envelope-file "$envelope_out")
        fi
        if [[ -n "$validation_out" ]]; then
          bundle_args+=(--validation-file "$validation_out" --integration-gate-file "$integration_gate_out")
        fi
        python3 -m pr_attention.bundle_cli "${bundle_args[@]}" >/dev/null
        readarray -t bundle_values < <(python3 - "$bundle_out" <<'PY'
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as handle:
            bundle = json.load(handle)
        print(bundle["bundle_sha256"])
        print(bundle["phase"])
        PY
        )
        bundle_digest="${bundle_values[0]}"
        bundle_phase="${bundle_values[1]}"

        python3 - "$out" "$GITHUB_OUTPUT" "$packet_out" "$packet_coverage" "$packet_complete" "$packet_patch_bytes" "$packet_digest" "$template_out" "$envelope_out" "$validation_out" "$review_result_status" "$review_result_valid" "$integration_gate_out" "$integration_gate_status" "$integration_merge_ready" "$bundle_out" "$bundle_digest" "$bundle_phase" <<'PY'
        import json, sys
        path, output, packet_path, coverage, complete, patch_bytes, packet_digest, template_path, envelope_path, validation_path, result_status, result_valid, integration_path, integration_status, integration_ready, bundle_path, bundle_digest, bundle_phase = sys.argv[1:]
        with open(path, encoding="utf-8") as handle:
            snapshot = json.load(handle)
        values = {
            "attention": snapshot["attention"],
            "head-sha": snapshot["head_sha"],
            "next-action-class": snapshot["next_action_class"],
            "review-scope": snapshot["delta"]["review_scope"],
            "delta-files": snapshot["delta"]["changed_files"],
            "snapshot-file": path,
            "review-packet-file": packet_path,
            "packet-coverage": coverage,
            "packet-complete": complete,
            "packet-patch-bytes": patch_bytes,
            "packet-sha256": packet_digest,
            "review-result-template-file": template_path,
            "review-envelope-file": envelope_path,
            "review-result-status": result_status,
            "review-result-valid": result_valid,
            "review-result-validation-file": validation_path,
            "integration-gate-file": integration_path,
            "integration-gate-status": integration_status,
            "integration-merge-ready": integration_ready,
            "evidence-bundle-file": bundle_path,
            "evidence-bundle-sha256": bundle_digest,
            "evidence-bundle-phase": bundle_phase,
        }
        with open(output, "a", encoding="utf-8") as handle:
            for key, value in values.items():
                handle.write(f"{key}={value}\n")
        PY
